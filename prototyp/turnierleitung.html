<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Turnierleitung</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#ecebf2; --surface:#ffffff; --ink:#1d1b2b; --muted:#5f5c73; --line:#cfcbdd;
  --danger:#b8241c; --on-ink:#ffffff; --ok-bg:#d2ecd1; --ok-ink:#173f1c; --gold-bg:#f3e2ae; --gold-ink:#4a3605;
  --ui:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --num:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#16141f; --surface:#232031; --ink:#efedf7; --muted:#a6a2bd; --line:#3a364e;
    --danger:#ff7a6e; --on-ink:#16141f; --ok-bg:#1c4023; --ok-ink:#d9f5d9; --gold-bg:#4b3b0e; --gold-ink:#ffeebd;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#16141f; --surface:#232031; --ink:#efedf7; --muted:#a6a2bd; --line:#3a364e;
  --danger:#ff7a6e; --on-ink:#16141f; --ok-bg:#1c4023; --ok-ink:#d9f5d9; --gold-bg:#4b3b0e; --gold-ink:#ffeebd;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:16px;line-height:1.4;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation}
#app{height:100%;overflow:auto}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;touch-action:manipulation}
button:focus-visible,textarea:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
h1,h2,p{margin:0}

.page{max-width:560px;margin:0 auto;padding:22px 16px 36px;display:flex;flex-direction:column;gap:14px}
h1{font-family:var(--num);font-weight:700;font-size:42px;line-height:1}
h2{font-size:17px;font-weight:600}
.lead{color:var(--muted)}
.hint{color:var(--muted);font-size:14px}
.err{color:var(--danger);font-weight:500}
textarea{font:inherit;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;width:100%;min-height:180px;resize:vertical}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px}
.seg button{border:1.5px solid var(--line);border-radius:12px;height:44px;font-family:var(--num);font-size:22px;font-weight:600;background:var(--surface)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.toggle i{flex:none;width:44px;height:26px;border-radius:99px;background:var(--line);position:relative}
.toggle i::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--surface)}
.toggle[aria-pressed="true"] i{background:var(--ink)}
.toggle[aria-pressed="true"] i::after{transform:translateX(18px)}
.primary{background:var(--ink);color:var(--on-ink);border-radius:16px;min-height:54px;font-weight:600;font-size:18px;width:100%;padding:0 14px}
.ghost{border:1.5px solid var(--line);background:var(--surface);border-radius:16px;min-height:48px;font-weight:500;width:100%;padding:0 14px}
.ghost.warn{color:var(--danger)}

.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.clock{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px 12px}
.clock .time{font-family:var(--num);font-weight:700;font-size:44px;line-height:1;font-variant-numeric:tabular-nums;flex:1}
.clock .time.over{color:var(--danger)}
.clock button{border:1.5px solid var(--line);border-radius:12px;height:44px;padding:0 14px;font-weight:500;background:var(--bg)}
.progress{height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.progress span{display:block;height:100%;background:var(--ok-ink)}
.tabs{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px}
.evrow{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px 8px 8px 12px}
.evrow span{flex:1;min-width:0}
.evrow small{display:block;color:var(--muted)}
.evrow button{border:1.5px solid var(--line);border-radius:10px;height:40px;padding:0 12px;color:var(--danger);background:var(--bg)}
input.txt{font:inherit;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;width:100%}
label.ghost{display:grid;place-items:center;cursor:pointer}
.tabs button{height:44px;border-radius:12px;border:1.5px solid var(--line);font-weight:600;background:var(--surface)}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}

.tables{display:flex;flex-direction:column;gap:8px}
.tcard{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px 12px}
.tcard.done{background:var(--ok-bg);color:var(--ok-ink);border-color:transparent}
.tcard.final{background:var(--gold-bg);color:var(--gold-ink);border-color:transparent}
.thead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:4px}
.thead b{font-family:var(--num);font-size:22px;font-weight:700}
.thead span{font-size:13px;font-weight:500}
.tnames{display:grid;grid-template-columns:1fr 1fr;gap:2px 10px;font-size:15px}
.tnames span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{text-align:right;padding:8px 5px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-weight:500;color:var(--muted);font-size:14px}
th:nth-child(2),td:nth-child(2){text-align:left}
td:nth-child(3){font-family:var(--num);font-weight:700;font-size:20px}
tr.cut td{border-bottom:2px solid var(--ink)}

.overlay{position:fixed;inset:0;background:rgba(10,8,20,.5);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:var(--bg);color:var(--ink);width:100%;max-width:560px;max-height:90%;overflow:auto;border-radius:22px 22px 0 0;
  padding:16px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px}
.shead{display:flex;align-items:center;justify-content:space-between;gap:10px}
.shead h2{font-family:var(--num);font-size:28px;font-weight:700;line-height:1.1}
.icon{width:44px;height:44px;border-radius:14px;background:var(--surface);border:1px solid var(--line);font-size:20px;flex:none}
.prow{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px 10px;display:flex;flex-direction:column;gap:6px}
.prow .pn{font-weight:600}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
  'use strict';
  var KEY = 'turnierleitung-v1';
  var PTS = [3,2,1,0];
  var ROUND_MS = 60 * 60 * 1000;
  var app = document.getElementById('app');
  var sheet = null;

  function fresh(){
    return {v:1, phase:'setup', namesText:'', rounds:3, auto:true, final:false, players:[], roundsData:[], cur:0,
      tab:'tables', timer:{endsAt:null, remaining:ROUND_MS}, err:''};
  }
  function load(){
    try{
      var s = JSON.parse(localStorage.getItem(KEY) || 'null');
      if(s && s.v === 1 && Array.isArray(s.players) && Array.isArray(s.roundsData)){
        if(s.auto === undefined){ s.auto = true; if(s.phase === 'setup') s.final = false; }
        return s;
      }
    }catch(e){}
    return null;
  }
  function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
  var S = load() || fresh();

  /* ---------- Tourwertung (eigener Speicher, bleibt beim Verwerfen eines Turniers erhalten) ---------- */
  var TKEY = 'mtg-tour-wertung-v1';
  function loadTour(){
    try{
      var t = JSON.parse(localStorage.getItem(TKEY) || 'null');
      if(t && t.v === 1 && Array.isArray(t.events)) return t;
    }catch(e){}
    return null;
  }
  function saveTour(){ try{ localStorage.setItem(TKEY, JSON.stringify(T)); }catch(e){} }
  var T = loadTour() || {v:1, events:[]};
  function nkey(n){ return String(n).trim().toLowerCase(); }
  function tourMap(){
    var m = {};
    T.events.forEach(function(ev){
      ev.rows.forEach(function(r){
        var e = m[nkey(r.name)] || (m[nkey(r.name)] = {name:r.name, pts:0, wins:0, events:0, best:99});
        e.pts += r.pts; e.wins += r.wins; e.events++; if(r.rank < e.best) e.best = r.rank;
      });
    });
    return m;
  }
  function eventRows(){
    var tt = totals(), rk = ranking(tt);
    return rk.map(function(i, pos){ return {name:S.players[i], pts:tt[i].pts, wins:tt[i].wins, oppPts:tt[i].oppPts, rank:pos + 1}; });
  }
  function syncSaved(){
    if(!S.savedId) return;
    T.events.forEach(function(ev){ if(ev.id === S.savedId) ev.rows = eventRows(); });
    saveTour();
  }
  function fmtDate(t){ try{ return new Date(t).toLocaleDateString('de-DE'); }catch(e){ return ''; } }
  function tourView(){
    if(!T.events.length){
      return '<p class="hint">Noch kein Turnier gespeichert. Nach der letzten Runde lässt sich das Ergebnis in die Tourwertung übernehmen.</p>' +
        '<label class="ghost">Sicherung einlesen<input type="file" accept=".json,application/json" hidden data-import></label>';
    }
    var m = tourMap();
    var rows = Object.keys(m).map(function(k){ return m[k]; }).sort(function(a,b){
      return b.pts - a.pts || b.wins - a.wins || a.best - b.best || a.name.localeCompare(b.name);
    });
    var h = '<p class="hint">' + T.events.length + ' von 6 Turnieren gespeichert.</p>' +
      '<div class="scroll"><table><thead><tr><th>Rang</th><th>Name</th><th>Punkte</th><th>Siege</th><th>Turniere</th></tr></thead><tbody>' +
      rows.map(function(r, pos){
        return '<tr><td>' + (pos + 1) + '</td><td>' + esc(r.name) + '</td><td>' + r.pts + '</td><td>' + r.wins + '</td><td>' + r.events + '</td></tr>';
      }).join('') + '</tbody></table></div><h2>Gespeicherte Turniere</h2>';
    T.events.forEach(function(ev){
      var first = ev.rows.filter(function(r){ return r.rank === 1; }).map(function(r){ return esc(r.name); }).join(', ');
      h += '<div class="evrow"><span>' + esc(ev.name) + '<small>' + fmtDate(ev.t) + ', ' + ev.rows.length + ' Spieler, Platz 1: ' + first + '</small></span>' +
        '<button data-a="sheet" data-v="delev" data-id="' + ev.id + '">Löschen</button></div>';
    });
    return h + '<button class="ghost" data-a="export">Sicherung herunterladen</button>' +
      '<label class="ghost">Sicherung einlesen<input type="file" accept=".json,application/json" hidden data-import></label>';
  }

  function esc(t){
    return String(t).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function parseNames(){
    return S.namesText.split(/\n/).map(function(x){ return x.trim(); }).filter(Boolean);
  }
  function shuffle(a){
    for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }
    return a;
  }

  /* ---------- Turnierlogik ---------- */
  function isActive(i){ return !(S.dropped && S.dropped[i]); }
  function activeCount(){ var c = 0; S.players.forEach(function(_, i){ if(isActive(i)) c++; }); return c; }
  function tableSizes(n){
    if(n < 6 && n !== 4) return n > 0 ? [n] : [];
    var t = Math.ceil(n/4), threes = 4*t - n, a = [];
    for(var i=0;i<t;i++) a.push(i < t - threes ? 4 : 3);
    return a;
  }
  /* Rundenzahl wie im Schweizer System für 1 gegen 1: Jeder Tisch zählt als eine Paarung, also wie zwei Spieler. */
  function autoRounds(n){
    var t = tableSizes(n).length, r = 1;
    while((1 << r) < 2 * t) r++;
    return r;
  }
  function totals(){
    var T = S.players.map(function(){ return {pts:0, wins:0, games:0, opps:[], oppPts:0}; });
    S.roundsData.forEach(function(r){
      r.tables.forEach(function(tb){
        tb.players.forEach(function(pi, k){
          tb.players.forEach(function(q){ if(q !== pi) T[pi].opps.push(q); });
          if(tb.places){
            var pl = tb.places[k];
            T[pi].pts += PTS[pl-1]; T[pi].games++; if(pl === 1) T[pi].wins++;
          }
        });
      });
    });
    T.forEach(function(t){ t.oppPts = t.opps.reduce(function(s,q){ return s + T[q].pts; }, 0); });
    return T;
  }
  function ranking(T){
    T = T || totals();
    return S.players.map(function(_, i){ return i; }).sort(function(a,b){
      return T[b].pts - T[a].pts || T[b].wins - T[a].wins || T[b].oppPts - T[a].oppPts || S.players[a].localeCompare(S.players[b]);
    });
  }
  function makeRound(kind){
    var T = totals(), tables = [];
    if(kind === 'final'){
      tables.push({players:ranking(T).filter(isActive).slice(0,4), places:null});
    }else{
      var first = S.roundsData.length === 0;
      var rest = (first ? shuffle(S.players.map(function(_, i){ return i; })) : ranking(T)).filter(isActive);
      var met = S.players.map(function(){ return {}; });
      T.forEach(function(t, i){ t.opps.forEach(function(q){ met[i][q] = true; }); });
      tableSizes(rest.length).forEach(function(sz){
        var tb = [rest.shift()];
        while(tb.length < sz){
          var pick = 0, lim = Math.min(rest.length, 8);
          for(var c=0;c<lim;c++){
            var cand = rest[c], isNew = true;
            for(var x=0;x<tb.length;x++){ if(met[tb[x]][cand]){ isNew = false; break; } }
            if(isNew){ pick = c; break; }
          }
          tb.push(rest.splice(pick,1)[0]);
        }
        tables.push({players:tb, places:null});
      });
    }
    S.roundsData.push({kind:kind, tables:tables});
    S.cur = S.roundsData.length - 1;
    S.timer = {endsAt:null, remaining:ROUND_MS};
    S.tab = 'tables';
  }
  function curRound(){ return S.roundsData[S.cur]; }
  function reported(r){ return r.tables.filter(function(t){ return !!t.places; }).length; }
  function isLast(){
    var r = curRound();
    return r.kind === 'final' || (!S.final && S.cur >= S.rounds - 1);
  }
  function nextKind(){
    var vor = S.roundsData.filter(function(r){ return r.kind === 'vor'; }).length;
    return vor < S.rounds ? 'vor' : 'final';
  }
  function timeLeft(){
    return S.timer.endsAt ? S.timer.endsAt - Date.now() : S.timer.remaining;
  }
  function fmtTime(ms){
    var neg = ms < 0; var s = Math.floor(Math.abs(ms)/1000);
    var m = Math.floor(s/60); s = s % 60;
    return (neg ? '+' : '') + (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
  }

  /* ---------- Darstellung ---------- */
  function viewSetup(){
    var n = parseNames().length;
    var seg = '<button data-a="rounds" data-v="auto" aria-pressed="' + (!!S.auto) + '" style="font-size:17px">Auto</button>' + [3,4,5,6,7].map(function(k){
      return '<button data-a="rounds" data-v="' + k + '" aria-pressed="' + (!S.auto && S.rounds === k) + '">' + k + '</button>';
    }).join('');
    return '<main class="page"><h1>Turnierleitung</h1>' +
      '<p class="lead">Teilnehmer eintragen, Pods auslosen, Tischergebnisse sammeln. Ein Name pro Zeile.</p>' +
      '<textarea data-names aria-label="Teilnehmer, ein Name pro Zeile" placeholder="Anna\nBen\nCem\n…">' + esc(S.namesText) + '</textarea>' +
      '<p class="hint" id="count">' + countText(n) + '</p>' +
      '<button class="ghost" data-a="fill">60 Testspieler eintragen</button>' +
      '<h2>Runden</h2><div class="seg">' + seg + '</div>' +
      '<p class="hint" id="rinfo">' + roundText(n) + '</p>' +
      '<button class="toggle" data-a="final" aria-pressed="' + S.final + '"><span>Zusätzlicher Finaltisch<br><span class="hint">Die vier Punktbesten spielen eine Runde mehr als alle anderen.</span></span><i></i></button>' +
      (S.err ? '<p class="err">' + esc(S.err) + '</p>' : '') +
      '<button class="primary" data-a="begin">Runde 1 auslosen</button>' +
      '<button class="ghost" data-a="sheet" data-v="tour">Tourwertung ansehen (' + T.events.length + ' von 6 Turnieren)</button></main>';
  }
  function roundText(n){
    var ok = n >= 4 && n !== 5;
    if(S.auto) return ok ? 'Automatisch: ' + autoRounds(n) + (autoRounds(n) === 1 ? ' Runde' : ' Runden') + ' bei ' + tableSizes(n).length + (tableSizes(n).length === 1 ? ' Tisch' : ' Tischen') + '. Alle spielen gleich viele Runden.'
      : 'Die Rundenzahl richtet sich nach der Anzahl der Tische.';
    return 'Fest eingestellt: ' + S.rounds + ' Runden' + (ok ? ', automatisch wären es ' + autoRounds(n) : '') + '.';
  }
  function countText(n){
    if(!n) return 'Noch keine Teilnehmer eingetragen.';
    if(n < 4 || n === 5) return n + ' Teilnehmer. Es braucht 4 oder mindestens 6 Spieler.';
    var sz = tableSizes(n), threes = sz.filter(function(x){ return x === 3; }).length;
    return n + ' Teilnehmer, ' + sz.length + (sz.length === 1 ? ' Tisch' : ' Tische') + (threes ? ', davon ' + threes + ' mit drei Spielern' : '') + '.';
  }

  function tableCard(tb, ti, r){
    var done = !!tb.places;
    var order = tb.players.map(function(_, k){ return k; });
    if(done) order.sort(function(a,b){ return tb.places[a] - tb.places[b]; });
    var names = order.map(function(k){
      return '<span>' + (done ? tb.places[k] + '. ' : '') + esc(S.players[tb.players[k]]) + '</span>';
    }).join('');
    var title = r.kind === 'final' ? 'Finaltisch' : 'Tisch ' + (ti + 1);
    return '<button class="tcard' + (done ? ' done' : (r.kind === 'final' ? ' final' : '')) + '" data-a="open" data-t="' + ti + '">' +
      '<div class="thead"><b>' + title + '</b><span>' + (done ? 'gemeldet, antippen zum Korrigieren' : 'Ergebnis melden') + '</span></div>' +
      '<div class="tnames">' + names + '</div></button>';
  }
  function standingsTable(){
    var T = totals(), rk = ranking(T);
    var cut = S.final && !S.roundsData.some(function(r){ return r.kind === 'final'; });
    var tm = tourMap();
    return '<div class="scroll"><table><thead><tr><th>Rang</th><th>Name</th><th>Punkte</th><th>Siege</th><th>Geg.-Pkt.</th><th>Tour</th></tr></thead><tbody>' +
      rk.map(function(i, pos){
        var prev = tm[nkey(S.players[i])];
        var tourPts = (prev ? prev.pts : 0) + (S.savedId ? 0 : T[i].pts);
        return '<tr' + (cut && pos === 3 ? ' class="cut"' : '') + '><td>' + (pos+1) + '</td><td>' + esc(S.players[i]) + (isActive(i) ? '' : ' (abgemeldet)') + '</td><td>' + T[i].pts + '</td><td>' + T[i].wins + '</td><td>' + T[i].oppPts + '</td><td>' + tourPts + '</td></tr>';
      }).join('') + '</tbody></table></div>' +
      '<p class="hint">Geg.-Pkt. ist die Punktsumme der bisherigen Gegner und entscheidet bei Gleichstand. Tour zeigt den Punktestand über alle Turniere' + (S.savedId ? '.' : ' einschließlich des laufenden.') + '</p>' +
      (cut ? '<p class="hint">Die Linie zeigt, wer aktuell am Finaltisch säße.</p>' : '');
  }
  function viewRun(){
    var r = curRound(), rep = reported(r), all = r.tables.length;
    var title = r.kind === 'final' ? 'Finaltisch' : 'Runde ' + (S.cur + 1) + ' von ' + S.rounds;
    var left = timeLeft();
    var h = '<main class="page"><div class="top"><h1>' + title + '</h1>' +
      '<button class="icon" data-a="sheet" data-v="menu" aria-label="Menü">\u2261</button></div>' +
      '<div class="clock"><span class="time' + (left < 0 ? ' over' : '') + '" id="time">' + fmtTime(left) + '</span>' +
      '<button data-a="timer">' + (S.timer.endsAt ? 'Anhalten' : (S.timer.remaining < ROUND_MS ? 'Weiter' : 'Runde starten')) + '</button></div>' +
      '<div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="' + all + '" aria-valuenow="' + rep + '"><span style="width:' + (100*rep/all) + '%"></span></div>' +
      '<p class="hint">' + rep + ' von ' + all + (all === 1 ? ' Tisch' : ' Tischen') + ' gemeldet.</p>' +
      '<div class="tabs"><button data-a="tab" data-v="tables" aria-pressed="' + (S.tab === 'tables') + '">Tische</button>' +
      '<button data-a="tab" data-v="rank" aria-pressed="' + (S.tab === 'rank') + '">Rangliste</button>' +
      '<button data-a="tab" data-v="tour" aria-pressed="' + (S.tab === 'tour') + '">Tour</button></div>';
    if(S.tab === 'tables'){
      if(rep === all){
        if(isLast()){
          var winner = '';
          if(r.kind === 'final'){
            var tb = r.tables[0], w = [];
            tb.players.forEach(function(pi, k){ if(tb.places[k] === 1) w.push(esc(S.players[pi])); });
            winner = ' Tagessieg: ' + w.join(' und ') + '.';
          }
          h += '<p><b>Alle Runden sind gespielt.</b>' + winner + '</p>' +
            (S.savedId
              ? '<p>Das Ergebnis steht in der Tourwertung.</p><button class="primary" data-a="newevent">Neues Turnier vorbereiten</button>'
              : '<button class="primary" data-a="sheet" data-v="save">Turnier abschließen und speichern</button>') +
            '<button class="ghost" data-a="tab" data-v="rank">Rangliste ansehen</button>';
        }else{
          h += '<button class="primary" data-a="nextround">' + (nextKind() === 'final' ? 'Finaltisch bilden' : 'Runde ' + (S.cur + 2) + ' auslosen') + '</button>';
        }
      }
      h += '<div class="tables">' + r.tables.map(function(tb, ti){ return tableCard(tb, ti, r); }).join('') + '</div>';
      if(rep < all) h += '<button class="ghost" data-a="sim">Offene Tische zum Test zufällig werten</button>';
    }else if(S.tab === 'tour'){
      h += tourView();
    }else{
      h += standingsTable();
    }
    return h + '</main>';
  }
  function viewSheet(){
    if(!sheet) return '';
    var close = '<button class="icon" data-a="close" aria-label="Schließen">\u00D7</button>';
    var body = '';
    if(sheet.type === 'table'){
      var r = curRound(), tb = r.tables[sheet.t], sz = tb.players.length;
      body = '<div class="shead"><h2>' + (r.kind === 'final' ? 'Finaltisch' : 'Tisch ' + (sheet.t + 1)) + '</h2>' + close + '</div>' +
        '<p class="hint">Platz für jeden Spieler wählen. Geteilte Plätze sind erlaubt.</p>';
      tb.players.forEach(function(pi, k){
        var btns = '';
        for(var pl=1; pl<=sz; pl++){
          btns += '<button data-a="pl" data-k="' + k + '" data-v="' + pl + '" aria-pressed="' + (sheet.draft[k] === pl) + '" aria-label="Platz ' + pl + '">' + pl + '</button>';
        }
        body += '<div class="prow"><span class="pn">' + esc(S.players[pi]) + '</span><div class="seg">' + btns + '</div></div>';
      });
      if(sheet.err) body += '<p class="err">' + esc(sheet.err) + '</p>';
      body += '<button class="primary" data-a="report">Ergebnis melden</button>';
    }else if(sheet.type === 'save'){
      body = '<div class="shead"><h2>Turnier speichern</h2>' + close + '</div>' +
        '<p>Die Rangliste dieses Turniers wird in die Tourwertung übernommen.</p>' +
        '<input class="txt" type="text" maxlength="40" data-evname value="' + esc(sheet.name) + '" aria-label="Name des Turniers">' +
        '<button class="primary" data-a="saveevent">In die Tourwertung übernehmen</button>';
    }else if(sheet.type === 'tour'){
      body = '<div class="shead"><h2>Tourwertung</h2>' + close + '</div>' + tourView();
    }else if(sheet.type === 'delev'){
      var dev = T.events.filter(function(ev){ return String(ev.id) === String(sheet.id); })[0];
      body = '<div class="shead"><h2>Turnier löschen?</h2>' + close + '</div>' +
        '<p>' + (dev ? esc(dev.name) : 'Dieses Turnier') + ' wird aus der Tourwertung entfernt.</p>' +
        '<button class="primary" data-a="delevent">Aus der Tourwertung löschen</button>' +
        '<button class="ghost" data-a="close">Behalten</button>';
    }else if(sheet.type === 'players'){
      var cr = curRound(), fresh0 = reported(cr) === 0 && cr.kind !== 'final';
      body = '<div class="shead"><h2>Teilnehmer</h2>' + close + '</div>' +
        '<p class="hint">Neue Spieler steigen ab der nächsten Auslosung mit 0 Punkten ein. Abgemeldete behalten ihre Punkte und werden nicht mehr gelost. ' + activeCount() + ' von ' + S.players.length + ' sind aktiv.</p>' +
        '<input class="txt" type="text" maxlength="30" data-newname value="' + esc(sheet.newName || '') + '" placeholder="Name des neuen Spielers" aria-label="Name des neuen Spielers">' +
        (sheet.err ? '<p class="err">' + esc(sheet.err) + '</p>' : '') +
        '<button class="primary" data-a="addplayer">Spieler nachtragen</button>' +
        (fresh0 ? '<button class="ghost" data-a="redraw">Diese Runde neu auslosen</button><p class="hint">Möglich, solange noch kein Tisch gemeldet hat. Damit gelten Nachträge und Abmeldungen schon für diese Runde.</p>' : '') +
        '<h2>Alle Spieler</h2>';
      S.players.map(function(_, i){ return i; }).sort(function(a,b){ return S.players[a].localeCompare(S.players[b]); }).forEach(function(i){
        body += '<div class="evrow"><span>' + esc(S.players[i]) + (isActive(i) ? '' : '<small>abgemeldet</small>') + '</span>' +
          '<button data-a="drop" data-i="' + i + '">' + (isActive(i) ? 'Abmelden' : 'Zurückholen') + '</button></div>';
      });
    }else if(sheet.type === 'menu'){
      body = '<div class="shead"><h2>Menü</h2>' + close + '</div>' +
        '<button class="ghost" data-a="sheet" data-v="players">Teilnehmer nachtragen oder abmelden</button>' +
        '<button class="ghost" data-a="timerreset">Timer auf 60 Minuten zurücksetzen</button>' +
        '<button class="ghost warn" data-a="sheet" data-v="reset">Turnier verwerfen</button>';
    }else if(sheet.type === 'reset'){
      body = '<div class="shead"><h2>Turnier verwerfen?</h2>' + close + '</div>' +
        '<p>Alle Runden und Ergebnisse werden gelöscht. Die Teilnehmerliste bleibt erhalten.</p>' +
        '<button class="primary" data-a="reset">Turnier verwerfen</button>' +
        '<button class="ghost" data-a="close">Behalten</button>';
    }
    return '<div class="overlay"><div class="sheet" role="dialog" aria-modal="true">' + body + '</div></div>';
  }
  function render(){
    var old = app.querySelector('.sheet'), st = old ? old.scrollTop : 0;
    app.innerHTML = (S.phase === 'setup' ? viewSetup() : viewRun()) + viewSheet();
    var now = app.querySelector('.sheet'); if(now && st) now.scrollTop = st;
    save();
  }

  setInterval(function(){
    var el = document.getElementById('time');
    if(!el || S.phase !== 'run') return;
    var left = timeLeft();
    el.textContent = fmtTime(left);
    if(left < 0) el.classList.add('over');
  }, 500);

  /* ---------- Eingaben ---------- */
  app.addEventListener('input', function(e){
    var t = e.target;
    if(t && t.hasAttribute && t.hasAttribute('data-names')){
      S.namesText = t.value; save();
    }else if(t && t.hasAttribute && t.hasAttribute('data-evname')){
      if(sheet) sheet.name = t.value;
    }else if(t && t.hasAttribute && t.hasAttribute('data-newname')){
      if(sheet){ sheet.newName = t.value; }
    }
    if(t && t.hasAttribute && t.hasAttribute('data-names')){
      var c = document.getElementById('count'); if(c) c.textContent = countText(parseNames().length);
      var ri = document.getElementById('rinfo'); if(ri) ri.textContent = roundText(parseNames().length);
    }
  });
  app.addEventListener('change', function(e){
    var t = e.target;
    if(!t || !t.hasAttribute || !t.hasAttribute('data-import') || !t.files || !t.files[0]) return;
    var fr = new FileReader();
    fr.onload = function(){
      try{
        var obj = JSON.parse(fr.result);
        if(obj && obj.v === 1 && Array.isArray(obj.events)){ T = obj; saveTour(); }
      }catch(err){}
      render();
    };
    fr.readAsText(t.files[0]);
  });
  app.addEventListener('click', function(e){
    if(e.target.classList && e.target.classList.contains('overlay')){ sheet = null; render(); return; }
    var b = e.target.closest ? e.target.closest('[data-a]') : null;
    if(!b) return;
    var a = b.getAttribute('data-a'), v = b.getAttribute('data-v');
    switch(a){
      case 'fill':
        var list = []; for(var i=1;i<=60;i++) list.push('Spieler ' + (i < 10 ? '0' : '') + i);
        S.namesText = list.join('\n'); S.err = ''; break;
      case 'rounds': if(v === 'auto'){ S.auto = true; }else{ S.auto = false; S.rounds = +v; } break;
      case 'final': S.final = !S.final; break;
      case 'begin':
        var names = parseNames();
        if(names.length < 4 || names.length === 5){ S.err = 'Es braucht 4 oder mindestens 6 Teilnehmer.'; break; }
        S.err = ''; S.players = names; S.roundsData = []; S.phase = 'run';
        if(S.auto) S.rounds = autoRounds(names.length);
        makeRound('vor'); break;
      case 'tab': S.tab = v; break;
      case 'timer':
        if(S.timer.endsAt){ S.timer = {endsAt:null, remaining:S.timer.endsAt - Date.now()}; }
        else{ S.timer = {endsAt:Date.now() + S.timer.remaining, remaining:S.timer.remaining}; }
        break;
      case 'timerreset': S.timer = {endsAt:null, remaining:ROUND_MS}; sheet = null; break;
      case 'open':
        var t = +b.getAttribute('data-t'), tb = curRound().tables[t];
        sheet = {type:'table', t:t, draft: tb.places ? tb.places.slice() : tb.players.map(function(){ return 0; }), err:''};
        break;
      case 'pl': sheet.draft[+b.getAttribute('data-k')] = +v; sheet.err = ''; break;
      case 'report':
        if(sheet.draft.some(function(x){ return !x; })){ sheet.err = 'Jeder Spieler braucht einen Platz.'; break; }
        if(sheet.draft.indexOf(1) < 0){ sheet.err = 'Mindestens ein Spieler muss Platz 1 haben.'; break; }
        curRound().tables[sheet.t].places = sheet.draft.slice(); sheet = null; syncSaved(); break;
      case 'sim':
        curRound().tables.forEach(function(tb2){
          if(!tb2.places) tb2.places = shuffle(tb2.players.map(function(_, k){ return k + 1; }));
        });
        break;
      case 'nextround': makeRound(nextKind()); break;
      case 'reset':
        var keep = S.namesText, rr = S.rounds, ff = S.final;
        var aa = S.auto; S = fresh(); S.namesText = keep; S.rounds = rr; S.final = ff; S.auto = aa; sheet = null; break;
      case 'addplayer':
        var nn = ((sheet && sheet.newName) || '').trim();
        if(!nn){ sheet.err = 'Bitte einen Namen eintragen.'; break; }
        if(S.players.some(function(x){ return nkey(x) === nkey(nn); })){ sheet.err = 'Diesen Namen gibt es schon.'; break; }
        S.players.push(nn); S.namesText = (S.namesText ? S.namesText.replace(/\s+$/, '') + '\n' : '') + nn;
        sheet.newName = ''; sheet.err = ''; syncSaved(); break;
      case 'drop':
        var di = +b.getAttribute('data-i');
        if(!S.dropped) S.dropped = {};
        if(isActive(di) && activeCount() <= 3){ sheet.err = 'Es müssen mindestens drei Spieler aktiv bleiben.'; break; }
        S.dropped[di] = isActive(di); sheet.err = ''; break;
      case 'redraw':
        var rr0 = curRound();
        if(reported(rr0) === 0 && rr0.kind !== 'final'){ S.roundsData.pop(); makeRound('vor'); sheet = null; }
        break;
      case 'saveevent':
        if(S.savedId || !sheet) break;
        var id = Date.now();
        T.events.push({id:id, name:(sheet.name || '').trim() || ('Turnier ' + (T.events.length + 1)), t:id, rows:eventRows()});
        saveTour(); S.savedId = id; sheet = null; S.tab = 'tour'; break;
      case 'delevent':
        T.events = T.events.filter(function(ev){ return String(ev.id) !== String(sheet.id); });
        if(S.savedId && String(S.savedId) === String(sheet.id)) S.savedId = null;
        saveTour(); sheet = (S.phase === 'setup') ? {type:'tour'} : null; break;
      case 'newevent':
        var kn = S.namesText, kr = S.rounds, kf = S.final, ka = S.auto;
        S = fresh(); S.namesText = kn; S.rounds = kr; S.final = kf; S.auto = ka; sheet = null; break;
      case 'export':
        try{
          var blob = new Blob([JSON.stringify(T, null, 1)], {type:'application/json'});
          var link = document.createElement('a');
          link.href = URL.createObjectURL(blob); link.download = 'tourwertung.json'; link.click();
        }catch(err){}
        break;
      case 'sheet':
        sheet = {type:v};
        if(v === 'save') sheet.name = 'Turnier ' + (T.events.length + 1);
        if(v === 'delev') sheet.id = b.getAttribute('data-id');
        break;
      case 'close': sheet = null; break;
    }
    render();
  });

  render();
})();
</script>
</body>
</html>
